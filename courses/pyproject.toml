[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-course-platform"
version = "1.0.0"
description = "AI Course Platform with lesson generation, presentations, and social media integration"
requires-python = ">=3.14.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
course-api = "api.app:app"

[tool.hatch.build.targets.wheel]
packages = ["agents", "services", "api", "config"]

[tool.uv]
required-version = ">=0.10.0"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax for target Python version)
    "B",    # flake8-bugbear (common bugs and anti-patterns)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — enforced by the formatter instead
    "B008",  # FastAPI Depends() in argument defaults is intentional
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "services", "api", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: tests that touch real services",
]
