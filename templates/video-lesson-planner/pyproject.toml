[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-lesson-planner"
version = "0.1.0"
description = "AI-powered YouTube video lesson planner with OpenRouter AI and YouTube API integration"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "fastapi[standard]>=0.138.1",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.21.0",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "python-pptx>=1.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty]
known-first-party = ["backend"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
