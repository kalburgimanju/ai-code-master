<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame 6 - The foundation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 100%);
            color: #FAF9F5;
            overflow: hidden;
            width: 1080px;
            height: 1080px;
            position: relative;
        }
        .clip {
            position: absolute;
            width: 1080px;
            height: 1080px;
            clip-path: inset(0);
        }
        .foundation-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            text-align: center;
        }
        .building-block {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
            border: 2px solid #00D4FF;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            width: 400px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease;
        }
        .building-block.active {
            opacity: 1;
            transform: translateY(0);
        }
        .block-title {
            color: #00D4FF;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .block-desc {
            color: #FAF9F5;
            font-size: 18px;
            opacity: 0.9;
        }
        .ai-icon {
            position: absolute;
            width: 80px;
            height: 80px;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }
        .rule-icon {
            position: absolute;
            width: 80px;
            height: 80px;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
        }
        .connector {
            position: absolute;
            stroke: #00FF94;
            stroke-width: 3;
            stroke-dasharray: 8, 4;
            opacity: 0;
        }
        .connection-line {
            position: absolute;
            background: linear-gradient(90deg, #00D4FF, transparent);
            width: 140px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
        }
        .diagram-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px dashed #00D4FF;
            border-radius: 50%;
            opacity: 0.3;
        }
        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #FFEB3B 0%, #FFE082 100%);
                color: #141413;
            }
            .building-block {
                background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(0, 212, 255, 0.2));
                border-color: #00D4FF;
                color: #141413;
            }
            .block-title { color: #00D4FF; }
            .block-desc { color: #141413; }
            .diagram-center {
                border-color: #00D4FF;
                background: rgba(0, 212, 255, 0.05);
            }
        }
    </style>
</head>
<body>
    <div class="clip">
        <div class="foundation-container">
            <!-- Main building blocks -->
            <div class="building-block" style="--delay: 0">
                <div class="block-title">AI Model</div>
                <div class="block-desc">Intelligent reasoning engine</div>
                <svg class="ai-icon" viewBox="0 0 24 24">
                    <path fill="#00D4FF" d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-6.6 6.6 8.38 8.38 0 0 1-3.8-.9L5 21l1.4-3.4a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 6.6-6.6 8.38 8.38 0 0 1 3.8.9z"/>
                    <path fill="#00FF94" d="M12 2a10 10 0 0 0-6.95 17.12l-3.45 3.45 2.12-2.12 1.41 1.41 4.74-4.74L12 2z"/>
                </svg>
            </div>

            <div class="connection-line"></div>

            <div class="building-block diagram-center" style="--delay: 0.5">
                <div style="margin-top: 80px; font-size: 16px; opacity: 0.7;">
                    Bridge
                </div>
            </div>

            <div class="connection-line"></div>

            <div class="building-block" style="--delay: 1">
                <div class="connector" style="top: 50%; left: -140px; width: 140px;">
                    <svg viewBox="0 0 100 10">
                        <line x1="0" y1="5" x2="100" y2="5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="block-title">Business Rules</div>
                <div class="block-desc">Clear logic and structure</div>
                <svg class="rule-icon" viewBox="0 0 24 24">
                    <path fill="#FF00FF" d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM17 13.5H7c-.6 0-1-.4-1-1s.4-1 1-1h10c.6 0 1 .4 1 1s-.4 1-1 1zm0-4H7c-.6 0-1-.4-1-1s.4-1 1-1h10c.6 0 1 .4 1 1s-.4 1-1 1z"/>
                </svg>
            </div>

            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
                <div style="color: #00D4FF; font-size: 28px; font-weight: 700; margin-bottom: 10px;">
                    Foundation
                </div>
                <div style="color: #FAF9F5; font-size: 18px; opacity: 0.8;">
                    <tspan x="0" dy="0">AI + Business Rules</tspan>
                </div>
            </div>

            <!-- Connecting line -->
            <svg class="connector" style="top: 50%; left: -140px; width: 140px;">
                <line x1="0" y1="5" x2="100" y2="5" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <script type="module">
        import gsap from 'https://esm.run/gsap';

        window.__timelines = {};
        window.__timelines["composition-06"] = gsap.timeline({ paused: true });

        const tl = window.__timelines["composition-06"];

        // Building blocks appear in sequence
        gsap.utils.toArray(".building-block").forEach((block, index) => {
            const delay = parseFloat(block.style.getPropertyValue('--delay')) || index * 0.3;

            gsap.fromTo(
                block,
                {
                    opacity: 0,
                    y: 30,
                    scale: 0.9
                },
                {
                    opacity: 1,
                    y: 0,
                    scale: 1,
                    duration: 0.8,
                    ease: "power3.out",
                    delay: delay
                }
            );

            // Icons appear
            const icon = block.querySelector('.ai-icon, .rule-icon');
            if (icon) {
                gsap.fromTo(
                    icon,
                    {
                        opacity: 0,
                        x: icon.classList.contains('ai-icon') ? 40 : -40
                    },
                    {
                        opacity: 0.8,
                        x: 0,
                        duration: 0.5,
                        ease: "back.out(1.2)",
                        delay: delay + 0.2
                    }
                );
            }
        });

        // Connection lines
        gsap.fromTo(
            ".connection-line",
            { opacity: 0 },
            { opacity: 0.5, duration: 1, ease: "power2.out" }
        );

        // Diagram center fades in
        gsap.to(
            ".diagram-center",
            {
                opacity: 0.5,
                duration: 1,
                ease: "power2.out",
                delay: 0.3
            }
        );

        // Center text appears
        tl.fromTo(
            ".foundation-container > div:last-child",
            { opacity: 0, y: 20 },
            {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "power2.out"
            },
            "-=0.5"
        );
    </script>
</body>
</html>
