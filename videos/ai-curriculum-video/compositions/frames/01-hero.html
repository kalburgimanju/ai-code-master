<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; }
    .clip { visibility: hidden; }
    .hero {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .accent-line {
      width: 80px; height: 4px;
      background: linear-gradient(90deg, #0693e3, #4F46E5);
      border-radius: 2px;
      margin-bottom: 40px; opacity: 0;
    }
    .title {
      font-family: "Nunito", sans-serif;
      font-size: 72px; font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 20px; opacity: 0;
    }
    .subtitle {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 32px; font-weight: 400;
      color: #94A3B8;
      margin-bottom: 48px; opacity: 0;
    }
    .stats {
      display: flex; gap: 48px; opacity: 0;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-family: "Nunito", sans-serif;
      font-size: 42px; font-weight: 700;
      color: #0693e3; display: block;
    }
    .stat-lab {
      font-size: 16px; color: #787670;
      font-family: "Source Serif 4", Georgia, serif;
    }
    .byline {
      position: absolute; bottom: 60px;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 22px; font-style: italic;
      color: #555451; opacity: 0;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" data-composition-id="01-hero" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="hero">
      <div id="accent" class="accent-line clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="title" class="title clip" data-start="0" data-duration="6" data-track-index="0">The Complete AI Curriculum</div>
      <div id="subtitle" class="subtitle clip" data-start="0" data-duration="6" data-track-index="0">Six courses. One roadmap.</div>
      <div id="stats" class="stats clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="stat"><span class="stat-num">670K+</span><span class="stat-lab">enrollments</span></div>
        <div class="stat"><span class="stat-num">194</span><span class="stat-lab">countries</span></div>
        <div class="stat"><span class="stat-num">6</span><span class="stat-lab">courses</span></div>
      </div>
      <div id="byline" class="byline clip" data-start="0" data-duration="6" data-track-index="0">by Manjunath Kalburgi</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to("#accent", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
    tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
    tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.3);
    tl.fromTo("#stats", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.5)" }, 2.0);
    tl.fromTo("#byline", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.0);

    window.__timelines["01-hero"] = tl;
  </script>
</body>
</html>
