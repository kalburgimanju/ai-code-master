<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; }
    .clip { visibility: hidden; }
    .scene {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px;
    }
    .phase-label {
      font-family: "Nunito", sans-serif;
      text-transform: uppercase; letter-spacing: 0.16em;
      font-size: 14px; font-weight: 600;
      color: #10B981; margin-bottom: 12px; opacity: 0;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%; max-width: 900px;
      text-align: center; opacity: 0; transform: translateY(20px);
    }
    .card-icon { font-size: 48px; display: block; margin-bottom: 16px; }
    .card-name { font-family: "Nunito", sans-serif; font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-track { font-family: "Nunito", sans-serif; font-size: 18px; font-weight: 600; color: #10B981; margin-bottom: 16px; display: block; }
    .card-desc { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; color: #94A3B8; line-height: 1.6; margin-bottom: 20px; }
    .tools {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    }
    .tool {
      font-size: 14px; background: rgba(16,185,129,0.1); color: #10B981;
      padding: 6px 16px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" data-composition-id="04-production" data-start="19" data-duration="5" data-width="1920" data-height="1080">
    <div class="scene">
      <div id="phase-label" class="phase-label clip" data-start="0" data-duration="5" data-track-index="0">Phase Three</div>
      <div class="card clip" data-start="0" data-duration="5" data-track-index="1">
        <span class="card-icon">🚀</span>
        <div class="card-name">AI Engineer</div>
        <span class="card-track">Production Track</span>
        <div class="card-desc">Deploy LLMs and agents at scale. Ship full-stack AI apps to Vercel, AWS, GCP, and Azure.</div>
        <div class="tools">
          <span class="tool">Vercel</span>
          <span class="tool">AWS</span>
          <span class="tool">GCP</span>
          <span class="tool">Azure</span>
          <span class="tool">Terraform</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#phase-label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
    tl.fromTo(".card", { opacity: 0, y: 30, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 0.5);

    window.__timelines["04-production"] = tl;
  </script>
</body>
</html>
