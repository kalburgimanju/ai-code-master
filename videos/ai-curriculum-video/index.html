<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: "Source Serif 4", Georgia, serif; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; }
    .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .clip { visibility: hidden; }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="29"
    data-width="1920"
    data-height="1080"
  >
    <!-- SCENE 1: Hero (0-6s) -->
    <div
      id="el-01-hero"
      class="scene"
      data-composition-id="01-hero"
      data-composition-src="compositions/frames/01-hero.html"
      data-start="0"
      data-duration="6"
      data-track-index="1"
    ></div>
    <audio
      id="el-01-hero-voice"
      src="assets/voice/01.wav"
      data-start="0"
      data-duration="6"
      data-track-index="10"
      data-volume="1"
    ></audio>

    <!-- SCENE 2: Phase 1 (6-14s) -->
    <div
      id="el-02-phase1"
      class="scene"
      data-composition-id="02-phase1"
      data-composition-src="compositions/frames/02-phase1.html"
      data-start="6"
      data-duration="8"
      data-track-index="1"
    ></div>
    <audio
      id="el-02-phase1-voice"
      src="assets/voice/02.wav"
      data-start="6"
      data-duration="8"
      data-track-index="10"
      data-volume="1"
    ></audio>

    <!-- SCENE 3: Phase 2 (14-19s) -->
    <div
      id="el-03-phase2"
      class="scene"
      data-composition-id="03-phase2"
      data-composition-src="compositions/frames/03-phase2.html"
      data-start="14"
      data-duration="5"
      data-track-index="1"
    ></div>
    <audio
      id="el-03-phase2-voice"
      src="assets/voice/03.wav"
      data-start="14"
      data-duration="5"
      data-track-index="10"
      data-volume="1"
    ></audio>

    <!-- SCENE 4: Production (19-24s) -->
    <div
      id="el-04-production"
      class="scene"
      data-composition-id="04-production"
      data-composition-src="compositions/frames/04-production.html"
      data-start="19"
      data-duration="5"
      data-track-index="1"
    ></div>
    <audio
      id="el-04-production-voice"
      src="assets/voice/04.wav"
      data-start="19"
      data-duration="5"
      data-track-index="10"
      data-volume="1"
    ></audio>

    <!-- SCENE 5: CTA (24-29s) -->
    <div
      id="el-05-cta"
      class="scene"
      data-composition-id="05-cta"
      data-composition-src="compositions/frames/05-cta.html"
      data-start="24"
      data-duration="5"
      data-track-index="1"
    ></div>
    <audio
      id="el-05-cta-voice"
      src="assets/voice/05.wav"
      data-start="24"
      data-duration="5"
      data-track-index="10"
      data-volume="1"
    ></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
