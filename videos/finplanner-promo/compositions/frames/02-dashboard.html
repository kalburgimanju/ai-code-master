<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; font-family: "Inter", sans-serif; }
    .clip { visibility: hidden; }
    .screenshot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0F172A; }
    .screenshot img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .highlight { position: absolute; border: 3px solid #4F46E5; border-radius: 12px; opacity: 0; pointer-events: none; }
    .label { position: absolute; background: #4F46E5; color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" id="root" data-composition-id="02-dashboard" data-start="0" data-duration="11.819" data-width="1920" data-height="1080">
    <div data-hf-id="hf-screenshot" id="screenshot" class="screenshot clip" data-start="0" data-duration="11.819" data-track-index="0">
      <img src="capture/screenshots/scroll-000.png" alt="Dashboard">
    </div>
    <div data-hf-id="hf-hl1" id="hl1" class="highlight clip" data-start="2" data-duration="3" data-track-index="1" style="left: 100px; top: 200px; width: 300px; height: 400px;"></div>
    <div data-hf-id="hf-hl2" id="hl2" class="highlight clip" data-start="3" data-duration="3" data-track-index="2" style="left: 500px; top: 200px; width: 500px; height: 300px;"></div>
    <div data-hf-id="hf-hl3" id="hl3" class="highlight clip" data-start="4" data-duration="3" data-track-index="3" style="right: 100px; top: 200px; width: 400px; height: 400px;"></div>
    <div data-hf-id="hf-lbl1" id="lbl1" class="label clip" data-start="2.5" data-duration="2" data-track-index="4" style="left: 150px; top: 180px;">Properties</div>
    <div data-hf-id="hf-lbl2" id="lbl2" class="label clip" data-start="3.5" data-duration="2" data-track-index="5" style="left: 650px; top: 180px;">Financial Tools</div>
    <div data-hf-id="hf-lbl3" id="lbl3" class="label clip" data-start="4.5" data-duration="2" data-track-index="6" style="right: 150px; top: 180px;">AI Insights</div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#screenshot", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 1.5, ease: "power3.out" }, 0);
    tl.fromTo("#hl1", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power2.out" }, 2);
    tl.fromTo("#hl2", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power2.out" }, 3);
    tl.fromTo("#hl3", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power2.out" }, 4);
    tl.fromTo("#lbl1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 2.5);
    tl.fromTo("#lbl2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 3.5);
    tl.fromTo("#lbl3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 4.5);
    tl.to("#screenshot img", { scale: 1.02, duration: 8, ease: "none" }, 0);
    window.__timelines["02-dashboard"] = tl;
  </script>
</body>
</html>
