<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; font-family: "Inter", sans-serif; }
    .clip { visibility: hidden; }
    .screenshot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0F172A; }
    .screenshot img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" id="root" data-composition-id="05-financial-planner" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <div data-hf-id="hf-screenshot" id="screenshot" class="screenshot clip" data-start="0" data-duration="8" data-track-index="0">
      <img src="capture/screenshots/planner.png" alt="Page">
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#screenshot", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 1.5, ease: "power3.out" }, 0);
    tl.to("#screenshot img", { scale: 1.02, duration: 6, ease: "none" }, 0);
    window.__timelines["05-financial-planner"] = tl;
  </script>
</body>
</html>
