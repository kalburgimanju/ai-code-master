<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; font-family: "Inter", sans-serif; }
    .clip { visibility: hidden; }
    .bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); }
    .content { position: absolute; width: 100%; text-align: center; top: 50%; transform: translateY(-50%); }
    .logo { font-size: 80px; font-weight: 800; color: #4F46E5; letter-spacing: 6px; opacity: 0; }
    .tagline { font-size: 32px; color: #E2E8F0; margin-top: 24px; opacity: 0; }
    .cta { display: inline-block; margin-top: 48px; padding: 20px 60px; background: #10B981; color: white; font-size: 24px; font-weight: 700; border-radius: 100px; opacity: 0; }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" id="root" data-composition-id="09-cta" data-start="0" data-duration="4.992" data-width="1920" data-height="1080">
    <div data-hf-id="hf-bg" id="bg" class="bg clip" data-start="0" data-duration="4.992" data-track-index="0"></div>
    <div data-hf-id="hf-content" id="content" class="content clip" data-start="0" data-duration="4.992" data-track-index="1">
      <div data-hf-id="hf-logo" id="logo" class="logo">FINPLANNER</div>
      <div data-hf-id="hf-tagline" id="tagline" class="tagline">Your Smart Financial Navigator</div>
      <div data-hf-id="hf-cta" id="cta" class="cta">Start Exploring Today</div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to("#bg", { opacity: 1, duration: 0 }, 0);
    tl.fromTo("#logo", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1, ease: "back.out(1.7)" }, 0.5);
    tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.5);
    tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.7)" }, 2.5);
    tl.to("#cta", { scale: 1.05, duration: 0.3, ease: "power2.inOut", yoyo: true, repeat: 2 }, 4);
    window.__timelines["09-cta"] = tl;
  </script>
</body>
</html>
