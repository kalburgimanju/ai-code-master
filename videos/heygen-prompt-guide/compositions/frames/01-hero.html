<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0F172A; }
    .clip { visibility: hidden; }
    .scene {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px;
    }
    .accent {
      width: 80px; height: 4px;
      background: linear-gradient(90deg, #0693e3, #4F46E5);
      border-radius: 2px; margin-bottom: 32px; opacity: 0;
    }
    .eyebrow {
      font-family: "Nunito", sans-serif;
      text-transform: uppercase; letter-spacing: 0.16em;
      font-size: 13px; font-weight: 600;
      color: #4F46E5; margin-bottom: 16px; opacity: 0;
    }
    .title {
      font-family: "Nunito", sans-serif;
      font-size: 60px; font-weight: 900;
      color: #fff; line-height: 1.1; margin-bottom: 16px; opacity: 0;
    }
    .subtitle {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 24px; color: #94A3B8; opacity: 0;
    }
    .tag {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(79, 70, 229, 0.12);
      border: 1px solid rgba(79, 70, 229, 0.3);
      border-radius: 999px;
      color: #A5B4FC;
      font-size: 13px;
      font-family: "Nunito", sans-serif;
      margin-top: 32px; opacity: 0;
    }
    /* Avatar styling - bottom right */
    .avatar-wrap {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(79, 70, 229, 0.4);
      box-shadow: 0 0 30px rgba(79, 70, 229, 0.2);
      opacity: 0;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-root" data-composition-id="01-hero" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="scene">
      <div id="accent" class="accent clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="5" data-track-index="0">HeyGen Video Agent</div>
      <div id="title" class="title clip" data-start="0" data-duration="5" data-track-index="0">Prompts That Work</div>
      <div id="subtitle" class="subtitle clip" data-start="0" data-duration="5" data-track-index="0">Real prompts you can steal from the official prompt guide</div>
      <div id="tag" class="tag clip" data-start="0" data-duration="5" data-track-index="0">📝 Updated May 2026</div>
    </div>
    <div id="avatar" class="avatar-wrap clip" data-start="0" data-duration="5" data-track-index="0">
      <img src="https://app.heygen.com/embeddings/ef75c18fca604ac6b359d6b6cb785a7f/image.png" alt="Presenter" />
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to("#accent", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
    tl.fromTo("#eyebrow", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);
    tl.fromTo("#title", { opacity: 0, y: 30, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.8);
    tl.fromTo("#subtitle", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.5);
    tl.fromTo("#tag", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 2.2);
    tl.to("#avatar", { opacity: 1, duration: 0.8, ease: "power2.out" }, 1.2);

    window.__timelines["01-hero"] = tl;
  </script>
</body>
</html>
